name: Build Samsung A04s KernelSU-Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 #[cite: 2]

    steps:
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12 #[cite: 2]

      - name: Checkout Patched Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex git \
            libelf-dev libssl-dev lz4 python3 zip unzip wget cpio \
            libncurses5-dev #[cite: 2]

      - name: Download Official Toolchain (Clang & GCC)
        run: |
          echo "-> Membajak Toolchain Lawas..."
          git clone --depth=1 https://github.com/dapurandroid/android_kernel_a047f_eur forked_repo #[cite: 2]
          mv forked_repo/toolchain ./toolchain #[cite: 2]
          rm -rf forked_repo #[cite: 2]

      - name: Compile Kernel (Android 12 Target)
        run: |
          # Deklarasi Variabel Android mutlak dari panduan Samsung[cite: 1]
          export PLATFORM_VERSION=12 #[cite: 1, 2]
          export ANDROID_MAJOR_VERSION=s #[cite: 1, 2]
          export ARCH=arm64 #[cite: 1, 2]
          
          # Buat version.config KOSONG agar tidak merusak nama kernel asli (-dirty)
          echo -e "CONFIG_LOCALVERSION_AUTO=n\nCONFIG_LOCALVERSION=\"\"\n" > "arch/arm64/configs/version.config" #[cite: 2]
          
          # Eksekusi Kompilasi dengan argument spesifik
          export COMPILER_ARGS="-C $(pwd) O=$(pwd)/out -j$(nproc) ARCH=arm64 CROSS_COMPILE=${GITHUB_WORKSPACE}/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android- CC=${GITHUB_WORKSPACE}/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang" #[cite: 1, 2]
          
          echo "-> Memulai Kompilasi Inti..."
          make $COMPILER_ARGS exynos850-a04sxx_defconfig version.config #[cite: 1, 2]
          make $COMPILER_ARGS #[cite: 1, 2]

      - name: Setup AIK-Linux & Package Odin Tar
        run: |
          echo "-> Membersihkan area kerja..."
          rm -rf AIK aik.tar.gz stock_boot.zip #[cite: 2]
          
          echo "-> Mengunduh AIK-Linux dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/AIK-Linux-v3.8-ALL.tar.gz -O aik.tar.gz #[cite: 2]
          
          echo "-> Mengekstrak AIK-Linux..."
          mkdir AIK #[cite: 2]
          tar -xzf aik.tar.gz -C AIK --strip-components=1 #[cite: 2]
          cd AIK #[cite: 2]
          
          echo "-> Mengunduh Stock Boot.img dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/stock_boot.zip -O stock_boot.zip #[cite: 2]
          unzip -q stock_boot.zip #[cite: 2]
          
          echo "-> Membongkar Boot.img dengan AIK..."
          ./unpackimg.sh boot.img #[cite: 2]
          
          echo "-> Mengosongkan OS Version & Patch Level (Bypass Rollback Protection)..."
          echo -n "" > split_img/boot.img-os_version #[cite: 2]
          echo -n "" > split_img/boot.img-os_patch_level #[cite: 2]
          
          echo "-> Menerapkan Bypass AVB & VBMETA di Fstab Ramdisk..."
          FSTAB_FILE=$(find ramdisk -name "fstab.exynos850" | head -n 1) #[cite: 2]
          if [ -f "$FSTAB_FILE" ]; then
            sudo sed -i 's/,avb_keys=[^[:space:]]*//g' "$FSTAB_FILE" #[cite: 2]
            sudo sed -i 's/,avb//g' "$FSTAB_FILE" #[cite: 2]
            sudo sed -i 's/avb//g' "$FSTAB_FILE" #[cite: 2]
            sudo sed -i 's/,vbmeta//g' "$FSTAB_FILE" #[cite: 2]
            sudo sed -i 's/vbmeta//g' "$FSTAB_FILE" #[cite: 2]
            sudo sed -i 's/,,/,/g' "$FSTAB_FILE" #[cite: 2]
          fi
          
          echo "-> Mencari Kernel Image hasil kompilasi..."
          KERNEL_IMAGE=$(find $GITHUB_WORKSPACE -type f -path "*/arch/arm64/boot/Image" | head -n 1) #[cite: 1, 2]
          
          echo "-> Menyuntikkan Kernel Image KSU-Next yang baru..."
          cp "$KERNEL_IMAGE" split_img/boot.img-kernel #[cite: 2]
          
          echo "-> Membuat direktori ramdisk wajib Android..."
          mkdir -p ramdisk/{debug_ramdisk,dev,metadata,mnt,proc,second_stage_resources,sys} #[cite: 2]
          
          echo "-> Membungkus ulang Boot.img..."
          ./repackimg.sh --nosudo #[cite: 2]
          
          echo "-> Mengemas menjadi format .tar untuk Odin..."
          mkdir -p $GITHUB_WORKSPACE/odin_output #[cite: 2]
          cp image-new.img $GITHUB_WORKSPACE/odin_output/boot.img #[cite: 2]
          cd $GITHUB_WORKSPACE/odin_output #[cite: 2]
          
          BUILD_DATE=$(date +%Y%m%d-%H%M) #[cite: 2]
          TAR_NAME="SamsungA04s-KSUNext-Odin-${BUILD_DATE}.tar" #[cite: 2]
          tar -H ustar -cf "$TAR_NAME" boot.img #[cite: 2]
          
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV #[cite: 2]

      - name: Upload Odin Tar Artifact
        uses: actions/upload-artifact@v4 #[cite: 2]
        with:
          name: odin-kernel-package #[cite: 2]
          path: odin_output/*.tar #[cite: 2]
          retention-days: 14 #[cite: 2]
